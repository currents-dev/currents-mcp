name: NPM - Promote beta to latest

on:
  workflow_dispatch:
    inputs:
      packageVersion:
        required: true
        type: string
        description: The version that should be promoted

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./mcp-server

    steps:
      - uses: actions/checkout@v4

      # No `registry-url`: it makes setup-node write an `_authToken` line to the
      # job's npmrc, and with no NODE_AUTH_TOKEN to expand it npm reads a
      # credential, treats auth as configured and never runs the OIDC exchange
      # (actions/setup-node#1551). registry.npmjs.org is npm's default anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      # The runner's bundled npm predates OIDC support for dist-tag, which
      # npm/cli#10038 added in 11.21.0 and 12.2.0. Pinned rather than `latest`:
      # this runs in the job holding `id-token: write`, so whatever it installs
      # can mint an npm credential for this package. Bumping it requires node
      # >= 24.15.0, which `node-version` above must keep satisfying.
      - name: Install npm with OIDC dist-tag support
        run: npm install -g npm@12.2.0 --ignore-scripts

      - name: Check nothing shadows the OIDC exchange
        run: |
          rc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$rc" ] && grep -q '_authToken' "$rc"; then
            echo "::error::$rc configures an auth token, so npm will skip the OIDC exchange and send that token instead. Drop whatever wrote it (usually setup-node's registry-url)."
            exit 1
          fi

      - name: Promote to latest
        run: |
          if ! npm dist-tag add @currents/mcp@${{ github.event.inputs.packageVersion }} latest; then
            echo "::error::The registry refused the dist-tag. Trusted publishing configurations are keyed on the workflow filename and each grants dist-tag separately, so @currents/mcp needs a configuration naming THIS file with 'Allow npm dist-tag' enabled on it — the one for publish.yaml does not carry over. https://www.npmjs.com/package/@currents/mcp/access"
            exit 1
          fi
          if npm dist-tag ls @currents/mcp | grep -q '^beta:'; then
            npm dist-tag rm @currents/mcp beta
          fi

  # Separate job so the third-party actions below do not run beside
  # `id-token: write`: neither needs OIDC, and both resolve a mutable tag.
  announce:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # linear-release refuses to start outside a git repository, whichever
      # command it is given. fetch-depth as its quick start documents.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark Linear release as complete
        id: release
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ github.event.inputs.packageVersion }}

      - name: Post to Slack
        if: success() && steps.release.outputs.release-url
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚀 Release: @currents/mcp@${{ github.event.inputs.packageVersion }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚀Release: @currents/mcp@${{ github.event.inputs.packageVersion }}* has been marked as complete in Linear.\n\n<${{ steps.release.outputs.release-url }}|View Release Notes>"
                  }
                }
              ]
            }
